# OpenCodeWizard — shared configuration
# Source this file in bash scripts:  source "$(dirname "$0")/config/variables.conf"
# PowerShell definitions (OpenCodeWizard.ps1) must stay in sync manually.

# ── Preset name strings ──
PRESET_DEVELOPER="developer"
PRESET_STANDARD="standard"
PRESET_MINIMAL="minimal"

# ── Developer preset — everything included ──
PRESET_DEVELOPER_PLUGINS=(
    "oh-my-openagent"
    "opencode-mem"
    "@different-ai/opencode-browser"
    "@tarquinen/opencode-smart-title"
    "opencode-token-speed-plugin"
    "opencode-codebase-index"
)
PRESET_DEVELOPER_MCPS=(
    "fetch" "puppeteer" "postgres" "context7"
    "codegraph" "docs-mcp" "lsp-mcp"
)

# ── Standard preset — essential plugins + core MCPs ──
PRESET_STANDARD_PLUGINS=(
    "oh-my-openagent"
    "opencode-token-speed-plugin"
    "opencode-codebase-index"
)
PRESET_STANDARD_MCPS=(
    "fetch" "docs-mcp"
)

# ── Minimal preset — minimal setup ──
PRESET_MINIMAL_PLUGINS=(
    "oh-my-openagent"
)
PRESET_MINIMAL_MCPS=(
    "fetch"
)
